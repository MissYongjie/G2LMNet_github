# HetData #1 | Gloucester-I | SPOT (t1) / NDVI (t2) | flooding | 990 x 554 pixels
# Paper setting (fixed final epoch, no GT-based selection).

dataset:
  file: hetdata1_gloucester1.mat
  t1_norm: minmax           # minmax | zscore | log_zscore
  t2_norm: minmax

seed: 0
deterministic: false
epochs: 50                  # total = graph pre-training + pixel training

superpixel:
  method: slico             # SLICO on the normdiff guidance image
  n_segments: 1500
  compactness: 25.0
  iterations: 10

graph:                      # Stage 1: KAN graph branch
  pretrain_epochs: 10
  hidden_dim: 3
  latent_dim: 2
  lr: 0.01
  weight_decay: 0.005
  lambda_reg: 1.0e-4
  smooth_alpha: 0.35
  smooth_iters: 2

pixel:                      # Stage 2: LightMamba pixel branch
  embed_dim: 32
  alm_kernel: 9
  alm_blocks: 2
  alm_expansion: 4
  alm_dropout: 0.0
  aspp_rates: [1, 2, 4, 8]
  lr: 0.005
  weight_decay: 0.001
  lr_milestones: [21]
  lr_gamma: 0.1

guidance:                   # scheduled graph guidance
  start_epoch: 10           # E_start
  end_epoch: 20             # E_end
  ramp_epochs: 60           # E_ramp
  strength: 0.75            # alpha_g
  tail_strength: 0.05       # alpha_tail
  pseudo_weight: 1.0        # w_p within the window
  pseudo_tail_weight: 0.1   # w_p after E_end
  pseudo_threshold: 0.7     # theta_ps
  pseudo_blur_kernel: 33
  pseudo_blur_sigma: 3.0

loss:
  lambda_fuse: 4.0
  lambda_tv: 1.0
  lambda_align: 0.55
  edge_k: 5.0
  prior_beta: 0.3
  aux_weight: 0.2
